<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four Letter Word</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Libre+Franklin:wght@900&display=swap">
<style>
:root{--bg:#ece9fb;--ink:#241f4d;--board:#3b3480;--hole:#d9d4f5;--p0:#22b8a6;--p1:#ee5d85;--panel:#ffffff;--muted:#5f5a8f;--cell:min(calc((100vw - 24px)/7),74px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17143a;--ink:#f1eeff;--board:#2e2870;--hole:#17143a;--panel:#241f55;--muted:#aaa5dd}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:14px 12px 28px;display:flex;flex-direction:column;gap:12px;align-items:center}
.logo{margin:4px 0 0;font-family:"Libre Franklin","Franklin Gothic Medium",Arial,sans-serif;text-transform:uppercase;font-size:clamp(26px,7.5vw,44px);font-weight:900;letter-spacing:.01em;line-height:1.1;text-align:center;text-wrap:balance}
.dot{display:inline-block;width:.74em;height:.74em;border-radius:50%;margin:0 .03em;vertical-align:baseline}
.dot.g{background:var(--p0)}.dot.r{background:var(--p1)}
#status{margin:0;min-height:1.5em;font-size:18px;text-align:center}
.hands{display:grid;gap:8px;width:100%}
.hand{background:var(--panel);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;border:3px solid transparent;transition:border-color .2s,opacity .2s;opacity:.65}
.hand.on{opacity:1}
.hand.on.p0{border-color:var(--p0)}.hand.on.p1{border-color:var(--p1)}
.hand b{min-width:76px;font-size:15px;font-weight:700}
.tiles{display:flex;gap:7px;flex:1;justify-content:flex-end}
.tile{all:unset;box-sizing:border-box;width:clamp(40px,12vw,52px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 clamp(18px,5.5vw,24px) "Fredoka",system-ui,sans-serif;color:#10213a;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tile.p0,.coin i.p0{background:var(--p0)}.tile.p1,.coin i.p1{background:var(--p1)}
.tile.rare,.coin i.rare{background:conic-gradient(#ffd23f,#ff7a3d,#ffd23f,#ff7a3d,#ffd23f);color:#3a1200}
.tile.rot,.coin i.rot{background:linear-gradient(135deg,#7b61ff,#d14bff);color:#fff}
.tile.sel{outline:4px solid var(--ink);outline-offset:2px;transform:translateY(-3px)}
.tile:disabled,.tile[aria-disabled=true]{cursor:default}
.tile:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
#board{--r:7;--c:7;position:relative;width:calc(var(--c)*var(--cell));height:calc(var(--r)*var(--cell));background:var(--board);border-radius:16px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.18)}
#holes,#cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr)}
#holes i{margin:8%;border-radius:50%;background:var(--hole)}
#cols{grid-template-rows:1fr;z-index:3}
#cols button{all:unset;cursor:pointer;display:block}
#cols button:hover,#cols button:focus-visible{background:rgba(255,255,255,.12)}
#coins{position:absolute;inset:0;z-index:2;pointer-events:none}
.coin{position:absolute;width:calc(100%/var(--c));height:calc(100%/var(--r));display:grid;place-items:center}
.coin i{font-style:normal;width:84%;height:84%;border-radius:50%;display:grid;place-items:center;font:700 clamp(16px,6vw,30px) "Fredoka",system-ui,sans-serif;color:#10213a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.coin.win i{outline:4px solid #fff;animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.coin.swear i{background:#e5252a!important;color:#fff!important;outline:4px solid #fff}
@media (prefers-reduced-motion:reduce){.coin.win i{animation:none}}
#tm{display:flex;align-items:center;gap:10px;width:100%;max-width:520px}
#tmtrack{flex:1;height:10px;border-radius:999px;background:var(--panel);overflow:hidden}
#tmbar{height:100%;width:100%;border-radius:999px}
#tmn{min-width:2ch;font-weight:700;font-size:18px;text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{all:unset;cursor:pointer;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:700;font-size:16px}
.btn:focus-visible{outline:3px solid var(--p0);outline-offset:2px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:8px 18px}
.help{font-size:14px;color:var(--muted);text-align:center;margin:0;max-width:44ch;line-height:1.45}
#ov{position:fixed;inset:0;background:rgba(10,8,30,.72);display:none;place-items:center;z-index:9;padding:20px}
#ov.on{display:grid}
#card{background:var(--panel);border-radius:20px;padding:24px;max-width:400px;max-height:calc(100vh - 40px);overflow:auto;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#card h2{margin:0;font-size:28px}
#card p{margin:0;color:var(--muted);line-height:1.45}
#card .def{font-size:13px;min-height:1.45em}
#card .how{text-align:left;margin:0;padding-left:20px;font-size:14px;color:var(--muted);line-height:1.45;display:flex;flex-direction:column;gap:6px}
#card .logo{font-size:clamp(16px,5.2vw,24px);margin:0;white-space:nowrap}
#stage{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
@media (min-width:900px){
  main{max-width:1100px}
  :root{--cell:min(calc((100vh - 250px)/7),88px)}
  #stage{display:grid;grid-template-columns:auto auto auto;justify-content:center;align-items:center;gap:24px}
  .hands{display:contents}
  #h0{grid-column:1;grid-row:1}#board{grid-column:2;grid-row:1}#h1{grid-column:3;grid-row:1}
  .hand{flex-direction:column;width:112px;padding:14px 10px;gap:12px;align-self:center}
  .hand b{min-width:0;text-align:center}
  .tiles{flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;gap:9px}
  .tile{width:56px}
  #h0 .tile.sel{transform:translateX(5px)}#h1 .tile.sel{transform:translateX(-5px)}
  #tm{max-width:680px}
}
</style>
</head>
<body>
<main>
<div id="tm"><div id="tmtrack"><div id="tmbar"></div></div><span id="tmn" aria-label="Seconds left">30</span></div>
<div id="stage"><section class="hands"><div class="hand p0" id="h0"><b></b><div class="tiles"></div></div><div class="hand p1" id="h1"><b></b><div class="tiles"></div></div></section>
<div id="board"><div id="holes"></div><div id="coins"></div><div id="cols"></div></div></div>
<p id="status"></p>
<div class="row"><button class="btn alt" id="pauseBtn">⏸ Pause</button><button class="btn alt" id="soundBtn">🔊 Sound on</button><button class="btn alt" id="menuBtn">New game</button></div>
</main>
<div id="ov"><div id="card"></div></div>

const rnd=()=>{const x=Math.random();return x<.025?{t:"H"}:x<.05?{t:"V"}:x<.075?{t:"CW"}:x<.1?{t:"CCW"}:{t:"L",ch:BAG[Math.floor(Math.random()*BAG.length)]}};
const SYM={H:"↔",V:"↕",CW:"↻",CCW:"↺"};
const LABEL={H:"Row exploder",V:"Column exploder",CW:"Rotate right",CCW:"Rotate left"};
const sym=c=>c.t==="L"?c.ch:SYM[c.t];
const isRot=c=>c.t==="CW"||c.t==="CCW";
const cls=c=>(c.t!=="L"?" rare":"")+(isRot(c)?" rot":"");
const $=s=>document.querySelector(s);
const LOGO='F<i class="dot g" aria-hidden="true"></i>UR-LETTER-W<i class="dot r" aria-hidden="true"></i>RD';
let AC=null,muted=false;
function ac(){if(muted)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){return null}return AC}
function tone(f,t0,d,type,vol,f2){const a=ac();if(!a)return;const T=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(vol,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+d+.05)}
function noise(t0,d,vol,f1,f2){const a=ac();if(!a)return;const T=a.currentTime+t0,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type="bandpass";fl.frequency.setValueAtTime(f1,T);fl.frequency.exponentialRampToValueAtTime(f2,T+d);const g=a.createGain();g.gain.setValueAtTime(vol,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(T)}
const sfx={
  thud:v=>{tone(180,0,.12,"sine",.5*v,60);noise(0,.05,.25*v,900,300)},
  boom:()=>{noise(0,.5,.7,1800,120);tone(110,0,.45,"sawtooth",.3,35)},
  whoosh:d=>{noise(0,.8,.5,d>0?300:2400,d>0?2400:300);tone(d>0?200:500,0,.8,"sine",.12,d>0?500:200)},
  chime:()=>{[[392,0],[440,.34],[494,.68]].forEach(([f,t])=>{tone(f,t,.24,"triangle",.3,f*1.12);tone(f/2,t,.24,"sine",.22,f*.56)})},
  buzz:()=>{tone(90,0,1,"sawtooth",.3);tone(97,0,1,"square",.12)},
  tick:()=>tone(880,0,.06,"square",.1),
  pop:i=>{const a=ac();if(!a)return;const b=1+i*.08;for(let k=0;k<7;k++)noise(Math.random()*.14,.03+Math.random()*.05,.22+Math.random()*.18,(500+Math.random()*1800)*b,(200+Math.random()*500)*b);tone(95*b,0,.12,"sine",.28,50)},
  land:v=>{noise(0,.07,.45*v,1400,500);tone(140,0,.09,"triangle",.4*v,70);noise(.05,.05,.2*v,2500,900)},
  timeout:()=>{tone(330,0,.18,"square",.22);tone(247,.2,.3,"square",.22)}
};
let grid,els,hands,turn,sel,busy,over,vsCPU,level="medium",paused=false,note="";
const LV={easy:"Easy",medium:"Medium",hard:"Hard",extreme:"Extreme"};
const names=()=>vsCPU?["You","Computer"]:["Player 1","Player 2"];

function findWord(g,set=W){
  const R=g.length,C=g[0].length;
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]])
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const cells=[];let s="";
      for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;
        if(rr<0||rr>=R||cc<0||cc>=C||!g[rr][cc]||g[rr][cc].t!=="L")break;
        cells.push([rr,cc]);s+=g[rr][cc].ch.toLowerCase();}
      if(cells.length===4){const rs=[...s].reverse().join("");if(set.has(s)||set.has(rs))return{cells,word:set.has(s)?s:rs};}
    }
  return null;
}
const dropRow=(g,c)=>{for(let r=g.length-1;r>=0;r--)if(!g[r][c])return r;return -1};
const destroyList=(t,r,c,g)=>{const o=[];if(t==="H")for(let k=0;k<g[0].length;k++)o.push([r,k]);else for(let k=0;k<g.length;k++)o.push([k,c]);return o};
function gravity(g,e){
  const R=g.length,C=g[0].length,moves=[];
  for(let c=0;c<C;c++){let w=R-1;
    for(let r=R-1;r>=0;r--)if(g[r][c]){
      if(w!==r){g[w][c]=g[r][c];g[r][c]=null;if(e){e[w][c]=e[r][c];e[r][c]=null}moves.push({r0:r,r1:w,c})}
      w--;}
  }
  return moves;
}
function rotArr(a,dir){
  const R=a.length,C=a[0].length,n=Array.from({length:C},()=>Array(R).fill(null));
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(dir>0)n[c][R-1-r]=a[r][c];else n[C-1-c][r]=a[r][c]}
  return n;
}
function applyMove(g,coin,c,p){
  const r=dropRow(g,c);if(r<0)return null;
  let n=g.map(x=>x.slice());n[r][c]={...coin,p};
  if(coin.t==="H"||coin.t==="V"){destroyList(coin.t,r,c,n).forEach(([a,b])=>n[a][b]=null);gravity(n)}
  else if(isRot(coin)){n[r][c]=null;n=rotArr(n,coin.t==="CW"?1:-1);gravity(n)}
  return n;
}

function setDims(r,c){
  R=r;C=c;
  const b=$("#board");b.style.setProperty("--r",r);b.style.setProperty("--c",c);
  const h=$("#holes"),cl=$("#cols");h.innerHTML="";cl.innerHTML="";
  for(let i=0;i<r*c;i++)h.appendChild(document.createElement("i"));
  for(let k=0;k<c;k++){
    const bt=document.createElement("button");bt.setAttribute("aria-label","Drop in column "+(k+1));
    bt.onclick=()=>{if(vsCPU&&turn===1)return;play(k,sel)};
    cl.appendChild(bt);
  }
}
function mkCoin(coin,p,r,c){
  const d=document.createElement("div");d.className="coin";
  d.style.left=(c*100/C)+"%";d.style.top=(r*100/R)+"%";
  const i=document.createElement("i");i.className="p"+p+cls(coin);
  i.textContent=sym(coin);
  d.appendChild(i);$("#coins").appendChild(d);return d;
}
function renderHands(){
  const n=names();
  for(let p=0;p<2;p++){
    const h=$("#h"+p);h.classList.toggle("on",p===turn&&!over);
    const lb=h.querySelector("b");lb.style.whiteSpace="pre-line";lb.textContent=n[p]+(vsCPU&&p===1?"\n"+LV[level]:"");
    const t=h.querySelector(".tiles");t.innerHTML="";
    hands[p].forEach((coin,i)=>{
      const b=document.createElement("button");
      b.className="tile p"+p+cls(coin)+(p===turn&&i===sel&&!over?" sel":"");
      b.textContent=sym(coin);
      b.setAttribute("aria-label",coin.t==="L"?"Letter "+coin.ch:LABEL[coin.t]);
      const mine=p===turn&&!busy&&!over&&!paused&&!(vsCPU&&p===1);
      if(!mine)b.setAttribute("aria-disabled","true");
      b.onclick=()=>{if(mine){sel=i;renderHands()}};
      t.appendChild(b);
    });
  }
  $("#status").textContent=over?"":paused?"Paused":(note||(vsCPU&&turn===1?"Computer is thinking…":n[turn]+": pick a coin, then a column"));
}

function start(cpu){
  vsCPU=cpu;setDims(7,7);grid=Array.from({length:R},()=>Array(C).fill(null));
  els=Array.from({length:R},()=>Array(C).fill(null));
  $("#coins").innerHTML="";
  hands=[Array.from({length:5},rnd),Array.from({length:5},rnd)];
  turn=0;sel=0;busy=false;over=false;paused=false;note="";setPauseBtn();
  $("#ov").classList.remove("on");renderHands();timerStart();
}
function showCard(html){$("#card").innerHTML=html;$("#ov").classList.add("on");const b=$("#card button");if(b)b.focus()}
function menu(){
  showCard('<h2 class="logo" aria-label="Four-Letter-Word">'+LOGO+'</h2><ul class="how"><li>Pick a coin from your hand, then choose a column to drop it in. It is replaced with a new random coin.</li><li>Spell a four-letter word in any line, across, down or diagonal, forwards or backwards, to win.</li><li>Gold coins explode: ↔ clears its row and ↕ clears its column.</li><li>Purple coins rotate the whole board 90° (↻ right, ↺ left), then everything falls again.</li><li>You have 30 seconds a turn. If time runs out, a random letter is dropped for you.</li><li>Spell a swear word and the board explodes and the game restarts.</li></ul><button class="btn" id="m1">Play the computer</button><button class="btn alt" id="m2">Two players</button>');
  $("#m1").onclick=levels;$("#m2").onclick=()=>start(false);
}
function levels(){
  showCard('<h2>Choose a level</h2><p>Easy plays casually. Extreme plans ahead and rarely misses a win.</p><div class="row">'+Object.keys(LV).map(k=>'<button class="btn" data-l="'+k+'">'+LV[k]+'</button>').join("")+'</div><button class="btn alt" id="back">Back</button>');
  document.querySelectorAll("#card [data-l]").forEach(b=>b.onclick=()=>{level=b.dataset.l;start(true)});
  $("#back").onclick=menu;
}
$("#menuBtn").onclick=menu;

const wait=a=>a.finished.catch(()=>{});
async function settle(snd){
  const moves=gravity(grid,els);
  if(snd){const gr={};moves.forEach(m=>{const d=260+(m.r1-m.r0)*70;gr[d]=(gr[d]||0)+1});
    Object.entries(gr).forEach(([d,n])=>setTimeout(()=>sfx.land(Math.min(1,.35+n*.12)),+d))}
  await Promise.all(moves.map(m=>{const e=els[m.r1][m.c];e.style.top=(m.r1*100/R)+"%";
    return wait(e.animate([{transform:`translateY(${-(m.r1-m.r0)*100}%)`,easing:"ease-in"},{transform:"translateY(0)"}],{duration:260+(m.r1-m.r0)*70}))}));
}
async function rotateBoard(dir){
  $("#status").textContent="Rotating the board "+(dir>0?"right":"left")+"…";sfx.whoosh(dir);
  const D={duration:800,easing:"ease-in-out",fill:"forwards"};
  const anims=[$("#board").animate([{transform:"rotate(0deg)"},{transform:`rotate(${dir*90}deg)`}],D)];
  document.querySelectorAll("#coins .coin i").forEach(i=>anims.push(i.animate([{transform:"rotate(0deg)"},{transform:`rotate(${-dir*90}deg)`}],D)));
  await wait(anims[0]);
  grid=rotArr(grid,dir);els=rotArr(els,dir);
  setDims(grid.length,grid[0].length);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const e=els[r][c];if(e){e.style.left=(c*100/C)+"%";e.style.top=(r*100/R)+"%"}}
  anims.forEach(a=>a.cancel());
}
async function play(c,slot){
  if(busy||over||paused)return;
  const r=dropRow(grid,c);if(r<0)return;
  busy=true;timerStop();
  const p=turn,coin=hands[p][slot];
  hands[p][slot]=rnd();renderHands();
  grid[r][c]={...coin,p};
  const el=mkCoin(coin,p,r,c);els[r][c]=el;
  {const dur=320+(r+1)*70;setTimeout(()=>sfx.thud(1),dur*.72);setTimeout(()=>sfx.thud(.4),dur*.93)}
  await wait(el.animate([
    {transform:`translateY(${-(r+1)*100}%)`,easing:"ease-in"},
    {transform:"translateY(0)",offset:.72,easing:"ease-out"},
    {transform:"translateY(-14%)",offset:.86,easing:"ease-in"},
    {transform:"translateY(0)"}],{duration:320+(r+1)*70}));
  if(coin.t==="H"||coin.t==="V"){
    const list=destroyList(coin.t,r,c,grid).filter(([a,b])=>grid[a][b]);
    if(coin.t==="V")list.sort((x,y)=>y[0]-x[0]);
    else list.sort((x,y)=>Math.abs(x[1]-c)-Math.abs(y[1]-c)||x[1]-y[1]);
    await Promise.all(list.map(([a,b],i)=>{const e=els[a][b];
      return new Promise(res=>setTimeout(res,i*60)).then(()=>{sfx.pop(i);return wait(e.animate([{transform:"scale(1)",opacity:1,filter:"brightness(1)"},{transform:"scale(1.5)",opacity:0,filter:"brightness(2)"}],{duration:300,easing:"ease-out"}))}).then(()=>e.remove())}));
    list.forEach(([a,b])=>{grid[a][b]=null;els[a][b]=null});
    await settle(true);
  }else if(isRot(coin)){
    await wait(el.animate([{opacity:1,transform:"scale(1)"},{opacity:0,transform:"scale(.4)"}],{duration:260}));
    el.remove();grid[r][c]=null;els[r][c]=null;
    await rotateBoard(coin.t==="CW"?1:-1);
    await settle(true);
  }
  const sw=findWord(grid,SWEAR);
  if(sw){
    over=true;
    sw.cells.forEach(([a,b])=>els[a][b].classList.add("swear"));
    renderHands();
    $("#status").textContent="Swear word! Everything explodes…";
    sfx.buzz();try{navigator.vibrate&&navigator.vibrate(900)}catch(e){}
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches)$("#board").animate(Array.from({length:26},(_,i)=>({transform:i===25?"translate(0,0)":`translate(${(Math.random()*10-5).toFixed(1)}px,${(Math.random()*10-5).toFixed(1)}px) rotate(${(Math.random()*2-1).toFixed(2)}deg)`})),{duration:1000,easing:"linear"});
    await new Promise(r=>setTimeout(r,1000));
    sfx.boom();const all=[];
    for(let a=0;a<R;a++)for(let b=0;b<C;b++)if(els[a][b])all.push(els[a][b]);
    await Promise.all(all.map((e,i)=>wait(e.animate([{transform:"scale(1)",opacity:1,filter:"brightness(1)"},{transform:"scale(1.6)",opacity:0,filter:"brightness(2)"}],{duration:420,delay:i*20,easing:"ease-out",fill:"backwards"})).then(()=>e.remove())));
    start(vsCPU);
    $("#status").textContent="Swearing clears the board. New game! "+names()[0]+" starts.";
    return;
  }
  const win=findWord(grid);
  if(win){
    over=true;busy=false;
    win.cells.forEach(([a,b])=>els[a][b].classList.add("win"));
    renderHands();
    const n=names()[p];
    $("#status").textContent=n+" spelled "+win.word.toUpperCase()+"!";sfx.chime();
    setTimeout(()=>showCard(`<h2>${n==="You"?"You win!":n+" wins!"}</h2><p>The word is <b>${win.word.toUpperCase()}</b>.</p><p class="def" id="def"></p><button class="btn" id="again">Play again</button><button class="btn alt" id="mm">Change mode</button>`),1400);
    setTimeout(()=>{const a=$("#again");if(a){a.onclick=()=>start(vsCPU);$("#mm").onclick=menu}defOf(win.word)},1450);
    return;
  }
  if(grid[0].every(x=>x)){
    over=true;busy=false;renderHands();
    showCard('<h2>Board full</h2><p>No word this time. It’s a draw.</p><button class="btn" id="again">Play again</button>');
    $("#again").onclick=()=>start(vsCPU);return;
  }
  turn=1-turn;sel=0;busy=false;note="";renderHands();timerStart();
  if(vsCPU&&turn===1)setTimeout(cpu,650);
}
const TURN=30;let tLeft=TURN,tId=null,tLast=0;
function showTimer(on){$("#tm").style.visibility=on?"visible":"hidden"}
function drawTimer(){
  const f=Math.max(0,tLeft)/TURN,bar=$("#tmbar");
  bar.style.width=(f*100)+"%";bar.style.background=tLeft<=5?"#e5252a":(turn===0?"var(--p0)":"var(--p1)");
  $("#tmn").textContent=Math.ceil(Math.max(0,tLeft));
}
function timerStop(){clearInterval(tId);tId=null}
function timerStart(){
  timerStop();tLeft=TURN;
  if(over||(vsCPU&&turn===1)){showTimer(false);return}
  showTimer(true);drawTimer();tLast=Date.now();tId=setInterval(tick,100);
}
function tick(){
  const now=Date.now(),dt=(now-tLast)/1000;tLast=now;
  if(paused||busy||over||$("#ov").classList.contains("on"))return;
  const prev=Math.ceil(tLeft);tLeft-=dt;drawTimer();
  if(tLeft>0&&tLeft<=5&&Math.ceil(tLeft)<prev)sfx.tick();
  if(tLeft<=0){timerStop();timeUp()}
}
function timeUp(){
  sfx.timeout();
  const h=hands[turn],letters=h.map((x,i)=>x.t==="L"?i:-1).filter(i=>i>=0);
  const slots=letters.length?letters:h.map((_,i)=>i);
  const slot=slots[Math.floor(Math.random()*slots.length)];
  const cols=[];for(let c=0;c<C;c++)if(dropRow(grid,c)>=0)cols.push(c);
  if(!cols.length)return;
  sel=slot;note="Time’s up! A random letter was dropped.";
  play(cols[Math.floor(Math.random()*cols.length)],slot);
}
function setPauseBtn(){$("#pauseBtn").textContent=paused?"▶ Resume":"⏸ Pause"}
$("#pauseBtn").onclick=()=>{if(over)return;paused=!paused;tLast=Date.now();setPauseBtn();renderHands()};
$("#soundBtn").onclick=()=>{muted=!muted;$("#soundBtn").textContent=muted?"🔇 Sound off":"🔊 Sound on";if(!muted)sfx.tick()};
document.addEventListener("pointerdown",()=>ac(),{once:true});

function noDef(el,w){el.innerHTML='Meaning not available here. <a href="https://www.google.com/search?q=define+'+w+'" target="_blank" rel="noopener" style="color:inherit">Look up '+w.toUpperCase()+'</a>'}
async function defOf(word){
  const el=$("#def");if(!el)return;
  el.textContent="Looking up the meaning…";
  try{
    const s=window.claude?await window.claude.use("sample"):null;
    if(!s){noDef(el,word);return}
    const r=await Promise.race([new Promise((_,j)=>setTimeout(j,9000)),s("Give a short dictionary definition (at most 15 words, plain English, without using the word itself) of the English word \""+word+"\". Start with the part of speech in brackets, like (noun). Reply with only the definition.",{modelTier:"quick"})]);
    const d=(typeof r==="string"?r:(r&&r.text)||"").trim();
    if($("#def")===el){if(d)el.textContent=d;else noDef(el,word)}
  }catch(e){if($("#def")===el)noDef(el,word)}
}

/* Computer player */
function patternScore(g){
  const R=g.length,C=g[0].length;let s=0;
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]])
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      let pat=[],ok=true,fixed=0;
      for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;
        if(rr<0||rr>=R||cc<0||cc>=C){ok=false;break}
        const x=g[rr][cc];if(x&&x.t!=="L"){ok=false;break}
        pat.push(x?x.ch.toLowerCase():null);if(x)fixed++;}
      if(!ok||fixed<2)continue;
      const k=pat.map(x=>x||".").join(""),rk=[...k].reverse().join("");const hit=hitCache.get(k)??(hitCache.set(k,(new RegExp(" "+k+" ").test(BIG)||new RegExp(" "+rk+" ").test(BIG))),hitCache.get(k));
      if(hit)s+=fixed*fixed;
    }
  return s;
}
function cpu(){
  if(over)return;
  if(paused){setTimeout(cpu,300);return}
  const me=hands[1],opp=hands[0],moves=[];
  me.forEach((coin,i)=>{for(let c=0;c<C;c++){const g=applyMove(grid,coin,c,1);if(g)moves.push({i,c,g,coin})}});
  if(level!=="extreme"){const keep=moves.filter(m=>!(isRot(m.coin)&&findWord(m.g)));if(keep.length&&keep.length<moves.length){moves.length=0;moves.push(...keep)}}
  const P={easy:{win:.35,safe:0,noise:1000},medium:{win:.85,safe:.6,noise:8},hard:{win:1,safe:1,noise:2},extreme:{win:1,safe:1,noise:.4,plan:1}}[level]||{win:1,safe:1,noise:2};
  const win=moves.find(m=>findWord(m.g));
  if(win&&Math.random()<P.win)return play(win.c,win.i);
  const safe=Math.random()<P.safe?moves.filter(m=>{
    for(const oc of opp)for(let c=0;c<m.g[0].length;c++){const g=applyMove(m.g,oc,c,0);if(g&&findWord(g))return false}
    return true;}):[];
  const pool=safe.length?safe:moves;
  let best=null,bs=-1e9;
  for(const m of pool){
    let sc=P.noise>=1000?Math.random():patternScore(m.g)-(m.coin.t!=="L"?3:0)+Math.random()*P.noise;
    if(P.plan)me.forEach((cn,j)=>{if(j===m.i)return;for(let c=0;c<m.g[0].length;c++){const g=applyMove(m.g,cn,c,1);if(g&&findWord(g))sc+=40}});
    if(sc>bs){bs=sc;best=m}
  }
  play(best.c,best.i);
}

start(false);menu();
